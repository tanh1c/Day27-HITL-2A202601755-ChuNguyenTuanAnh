name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint · type · test · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest with coverage
        run: |
          mkdir -p reports
          set -o pipefail
          python -m pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=reports/junit.xml | tee reports/pytest.txt

      - name: Syntax compile
        run: python -m compileall -q app.py audit.py demo.py graph.py models.py

      - name: Streamlit health smoke test
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > reports/streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          trap 'kill $STREAMLIT_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8501/_stcore/health | grep -q "ok"; then
              echo "streamlit health: OK"
              exit 0
            fi
            sleep 1
          done
          cat reports/streamlit.log
          exit 1

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab27-ci-evidence
          path: |
            reports/
            coverage.xml
          if-no-files-found: warn
